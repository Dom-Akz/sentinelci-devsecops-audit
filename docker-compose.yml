services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: pfe-gitlab
    hostname: gitlab.local
    restart: unless-stopped
    shm_size: "256m"

    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8080'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        prometheus_monitoring['enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        registry_external_url 'http://localhost:5050'
        registry['enable'] = true
        registry_nginx['enable'] = true
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false

    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:5050:5050"

    volumes:
      - ./gitlab/config:/etc/gitlab
      - ./gitlab/logs:/var/log/gitlab
      - ./gitlab/data:/var/opt/gitlab

    deploy:
      resources:
        limits:
          memory: 6G


  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    container_name: pfe-gitlab-runner
    restart: unless-stopped
    depends_on:
      - gitlab
    volumes:
      - ./runner/config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock

  gitlab-runner-helper:
    image: registry.gitlab.com/gitlab-org/gitlab-runner/gitlab-runner-helper:x86_64-v19.5.2

  gitleaks:
    image: zricethezav/gitleaks:latest

  semgrep:
    image: semgrep/semgrep:latest

  hadolint:
    image: local/hadolint-shell:2.15.1
    build:
      context: ./security/hadolint

  hadolint-upstream:
    image: hadolint/hadolint:latest

  syft:
    image: local/syft-shell:1.56.0
    build:
      context: ./security/syft

  syft-upstream:
    image: anchore/syft:latest

  trivy:
    image: aquasec/trivy:latest

  grype:
    image: anchore/grype:latest

  dockle:
    image: goodwithtech/dockle:v0.4.15

  alpine:
    image: alpine:latest

  pfe-vulnerable-app:
    image: pfe-vulnerable-app:1.0
    build:
      context: ./app
